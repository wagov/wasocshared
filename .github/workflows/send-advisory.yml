name: Send advisory

on:
  push:
    branches: [main]

concurrency:
  group: send-advisory-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-modified-files:
    name: Send new advisory files
    runs-on: ubuntu-26.04
    environment:
      name: communication
    steps:
      - name: Checkout docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.7.7

      - name: Send advisories
        env:
          SENDGRID_API: ${{ secrets.SENDGRID_API }}
        run: mise run send-advisory
