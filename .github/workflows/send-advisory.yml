name: Send advisory

on:
  push:
    branches: [main]

concurrency:
  group: send-advisory-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-modified-files:
    name: Send new advisory files
    runs-on: ubuntu-26.04
    environment:
      name: communication
    steps:
      - name: Checkout docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.7

      - name: Send advisories
        env:
          SENDGRID_API: ${{ secrets.SENDGRID_API }}
        run: mise run send-advisory
