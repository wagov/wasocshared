name: Send advisory

on:
  push:
    branches: [main]

concurrency:
  group: send-advisory-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-modified-files:
    name: Send new advisory files
    runs-on: ubuntu-26.04
    environment:
      name: communication
    steps:
      - name: Checkout docs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Set up mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.7

      - name: Send advisories
        env:
          SENDGRID_API: ${{ secrets.SENDGRID_API }}
        run: mise run send-advisory
